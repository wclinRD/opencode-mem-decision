<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenCode Memory Decision</title>
  <style>
    :root {
      --bg: #f7f7f9;
      --surface: #ffffff;
      --surface-2: #f1f2f4;
      --border: #e2e2e5;
      --text: #1a1a1f;
      --muted: #6d6d76;
      --primary: #0066cc;
      --primary-hover: #0052a3;
      --danger: #cc3333;
      --danger-hover: #a02828;
      --success: #1c8a3c;
      --success-bg: #e6f5ec;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(0,0,0,0.05), 0 4px 12px rgba(0,0,0,0.06);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121214;
        --surface: #1c1c1f;
        --surface-2: #27272a;
        --border: #38383b;
        --text: #e8e8ec;
        --muted: #9a9aa3;
        --primary: #4a9eff;
        --primary-hover: #2f85ff;
        --danger: #ff4f4f;
        --danger-hover: #d63a3a;
        --success: #2fbf5a;
        --success-bg: #1a3a22;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: var(--shadow-sm);
    }
    .app-title {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-title svg { flex-shrink: 0; }
    .stats {
      font-size: 14px;
      color: var(--muted);
    }
    .stats strong {
      color: var(--text);
      font-weight: 600;
    }
    .main {
      flex: 1;
      padding: 24px 32px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
    }
    .tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    @media (max-width: 768px) {
      .app-header { padding: 16px 20px; }
      .app-title { font-size: 18px; }
      .main { padding: 20px; }
      .stats { display: none; }
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
      margin-bottom: 16px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: 13px;
      font-weight: 500;
    }
    input, textarea, button {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
    }
    input:focus, textarea:focus, button:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(0,102,204,0.2);
    }
    button {
      cursor: pointer;
      background: var(--surface);
    }
    button.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    button.primary:hover { background: var(--primary-hover); }
    button.danger {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    button.danger:hover { background: var(--danger-hover); }
    button.secondary {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
    }
    button.secondary:hover { background: var(--border); }
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }
    .search-controls input {
      width: 100%;
      max-width: 320px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    @media (max-width: 400px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s;
    }
    .card:hover { box-shadow: var(--shadow); }
    .card h3 {
      margin: 0;
      font-size: 15px;
      word-break: break-word;
    }
    .card pre {
      margin: 0;
      font-size: 13px;
      overflow: auto;
      white-space: pre-wrap;
      background: var(--surface-2);
      padding: 8px;
      border-radius: 6px;
      max-height: 200px;
      border: 1px solid var(--border);
    }
    .meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .pill {
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 2px 8px;
      font-size: 12px;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
    }
    .error {
      color: var(--danger);
      font-size: 13px;
    }
    .empty {
      color: var(--muted);
      font-size: 14px;
      padding: 32px 0;
      text-align: center;
    }
    .section-title {
      margin: 24px 0 12px;
      font-size: 18px;
      font-weight: 600;
    }
    textarea {
      min-height: 80px;
      resize: vertical;
      font-family: inherit;
    }
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    @media (max-width: 768px) {
      .toast-container { top: auto; bottom: 20px; right: 16px; left: 16px; flex-direction: row; }
    }
    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      box-shadow: var(--shadow);
      font-size: 14px;
      color: var(--text);
    }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }
  </style>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary)">
        <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Z"/>
        <path d="M12 6v6l4 2"/>
      </svg>
      OpenCode Memory Decision
    </h1>
    <div class="stats" id="stats">
      <span>Memories: <strong id="statMemories">0</strong></span>
      <span>Knowledge: <strong id="statKnowledge">0</strong></span>
    </div>
  </header>

  <main class="main">
    <div class="tabs" id="viewTabs">
      <button class="tab active" data-view="memories">Memories</button>
      <button class="tab" data-view="knowledge">Knowledge</button>
    </div>

    <div id="memoriesView">
      <form id="addForm" class="form-card">
        <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:end;">
          <div class="field" style="flex:1 1 300px;">
            <label for="content">Content</label>
            <textarea id="content" name="content" required placeholder="Memory content..."></textarea>
          </div>
          <div class="field">
            <label for="scope">Scope</label>
            <input id="scope" name="scope" value="project" placeholder="scope (default: project)" />
          </div>
          <button type="submit" class="primary">Add Memory</button>
        </div>
      </form>

      <div class="controls search-controls">
        <input id="searchInput" type="text" placeholder="Search memories..." />
        <select id="scopeFilter">
          <option value="all">All scopes</option>
        </select>
        <select id="sortSelect">
          <option value="desc">Newest first</option>
          <option value="asc">Oldest first</option>
        </select>
        <button id="searchButton" class="secondary">Search</button>
        <button id="deleteAllFilterButton" class="danger" disabled>Delete All by Filter</button>
      </div>

      <div id="memoryList" class="grid"></div>
    </div>

    <div id="knowledgeView" style="display: none;">
      <h2 class="section-title">Knowledge</h2>
      <div id="knowledgeList" class="grid"></div>
    </div>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <script>
    const API = "/api";
    const base64Credentials = ""; // set if auth is enabled: btoa(username + ":" + password)
    const headers = base64Credentials ? { Authorization: "Basic " + base64Credentials } : {};

    async function request(path, options = {}) {
      const url = API + path;
      const res = await fetch(url, {
        ...options,
        headers: { "Content-Type": "application/json", ...headers, ...options.headers },
      });
      let data = null;
      try { data = await res.json(); } catch (e) {}
      if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);
      return data;
    }

    function toast(message, type = 'info') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = 'toast ' + (type === 'success' ? 'success' : type === 'error' ? 'error' : '');
      t.textContent = message;
      c.appendChild(t);
      setTimeout(() => { t.remove(); }, 4000);
    }

    async function loadStats() {
      try {
        const stats = await request("/stats");
        document.getElementById("statMemories").textContent = stats.memories;
        document.getElementById("statKnowledge").textContent = stats.knowledge;
      } catch (e) {
        console.error("stats error", e);
      }
    }

    let scopesPopulated = false;
    function populateScopeFilter(data) {
      const sel = document.getElementById("scopeFilter");
      const existing = new Set();
      data.forEach((m) => existing.add(m.scope || "default"));
      const currentValues = new Set();
      Array.from(sel.options).forEach((opt) => currentValues.add(opt.value));
      Array.from(existing).sort().forEach((scope) => {
        if (!currentValues.has(scope)) {
          const opt = document.createElement("option");
          opt.value = scope;
          opt.textContent = scope;
          sel.appendChild(opt);
        }
      });
      scopesPopulated = true;
    }

    async function loadMemories(filter = null) {
      const list = document.getElementById("memoryList");
      list.innerHTML = "";
      try {
        let data = await request("/memory");
        if (!filter) populateScopeFilter(data);
        const query = (filter || document.getElementById("searchInput").value).trim();
        const scopeFilter = document.getElementById("scopeFilter").value;
        const sortSelect = document.getElementById("sortSelect").value;
        if (query || scopeFilter !== "all") {
          data = await request("/memory/search?query=" + encodeURIComponent(query) + "&scope=" + encodeURIComponent(scopeFilter === "all" ? "default" : scopeFilter));
        }
        data.sort((a, b) => {
          const order = sortSelect === "asc" ? 1 : -1;
          return order * (new Date(a.createdAt) - new Date(b.createdAt));
        });
        if (!data || !data.length) {
          list.innerHTML = `<div class="empty">No memories found.</div>`;
          return;
        }
        data.forEach((m) => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <h3>${escapeHtml(m.id)}</h3>
            <pre>${escapeHtml(m.content)}</pre>
            <div class="meta">
              <span class="pill">${escapeHtml(m.scope || "default")}</span>
              <span>created: ${escapeHtml(m.createdAt)}</span>
              <span>updated: ${escapeHtml(m.updatedAt)}</span>
            </div>
            <div class="actions">
              <button class="danger" data-id="${escapeHtml(m.id)}">Delete</button>
            </div>
          `;
          card.querySelector("button").addEventListener("click", () => deleteMemory(m.id));
          list.appendChild(card);
        });
      } catch (e) {
        list.innerHTML = `<div class="empty">Error: ${escapeHtml(e.message)}</div>`;
        toast("Error: " + e.message, "error");
      }
    }

    async function addMemory(content, scope = "project") {
      const result = await request("/memory", { method: "POST", body: JSON.stringify({ content, scope }) });
      return result;
    }

    async function deleteMemory(id) {
      if (!confirm("Delete memory?")) return;
      await request("/memory/" + id, { method: "DELETE" });
      toast("Memory deleted.", "success");
      await loadMemories();
      await loadStats();
    }

    document.getElementById("addForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const content = document.getElementById("content").value.trim();
      const scope = document.getElementById("scope").value.trim() || "project";
      if (!content) return;
      try {
        await addMemory(content, scope);
        document.getElementById("content").value = "";
        toast("Memory added.", "success");
        await loadMemories();
        await loadStats();
      } catch (e) {
        toast("Error: " + e.message, "error");
      }
    });

    document.getElementById("searchButton").addEventListener("click", () => {
      const q = document.getElementById("searchInput").value.trim();
      loadMemories(q || null);
    });
    document.getElementById("searchInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        const q = document.getElementById("searchInput").value.trim();
        loadMemories(q || null);
      }
    });
    const deleteAllFilterButton = document.getElementById("deleteAllFilterButton");
    function updateDeleteAllFilterState() {
      const q = document.getElementById("searchInput").value.trim();
      const scopeFilter = document.getElementById("scopeFilter").value;
      deleteAllFilterButton.disabled = !(q || scopeFilter !== "all");
    }
    document.getElementById("searchInput").addEventListener("input", updateDeleteAllFilterState);
    document.getElementById("scopeFilter").addEventListener("change", updateDeleteAllFilterState);
    deleteAllFilterButton.addEventListener("click", async () => {
      const q = document.getElementById("searchInput").value.trim();
      const scopeFilter = document.getElementById("scopeFilter").value;
      if (!confirm(`Delete ${q ? "matching" : "all within"} scope "${scopeFilter}"?`)) return;
      try {
        const deleted = await request("/memory?" + new URLSearchParams({ query: q, scope: scopeFilter }), { method: "DELETE" });
        toast(`Deleted ${deleted.deleted} memory(ies).`, "success");
        await loadMemories();
        await loadStats();
      } catch (e) {
        toast("Error: " + e.message, "error");
      }
    });

    const tabs = document.querySelectorAll('#viewTabs .tab');
    const memoriesView = document.getElementById('memoriesView');
    const knowledgeView = document.getElementById('knowledgeView');
    let activeView = 'memories';
    let knowledgeLoaded = false;

    function switchView(view) {
      if (activeView === view) return;
      activeView = view;
      tabs.forEach((tab) => {
        tab.classList.toggle('active', tab.dataset.view === view);
      });
      if (view === 'memories') {
        memoriesView.style.display = 'block';
        knowledgeView.style.display = 'none';
        loadMemories();
      } else {
        memoriesView.style.display = 'none';
        knowledgeView.style.display = 'block';
        if (!knowledgeLoaded) {
          loadKnowledge();
          knowledgeLoaded = true;
        }
      }
    }

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => switchView(tab.dataset.view));
    });

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    }

    async function loadKnowledge() {
      const list = document.getElementById("knowledgeList");
      list.innerHTML = "";
      try {
        const data = await request("/knowledge");
        if (!data || !data.length) {
          list.innerHTML = `<div class="empty">No knowledge found.</div>`;
          return;
        }
        data.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
        data.forEach((k) => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <h3>${escapeHtml(k.id)}</h3>
            <pre>${escapeHtml(k.content)}</pre>
            <div class="meta">
              <span>created: ${escapeHtml(k.createdAt)}</span>
              <span>updated: ${escapeHtml(k.updatedAt)}</span>
            </div>
            <div class="actions">
              <button class="danger" data-id="${escapeHtml(k.id)}">Delete</button>
            </div>
          `;
          card.querySelector("button").addEventListener("click", () => deleteKnowledge(k.id));
          list.appendChild(card);
        });
      } catch (e) {
        list.innerHTML = `<div class="empty">Error: ${escapeHtml(e.message)}</div>`;
        toast("Error: " + e.message, "error");
      }
    }

    async function deleteKnowledge(id) {
      if (!confirm("Delete knowledge?")) return;
      await request("/knowledge/" + id, { method: "DELETE" });
      toast("Knowledge deleted.", "success");
      await loadKnowledge();
      await loadStats();
    }

    (async () => {
      await loadStats();
      await loadMemories();
    })();
  </script>
</body>
</html>
